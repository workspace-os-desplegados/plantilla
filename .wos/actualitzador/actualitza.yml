# L'actualitzador del Workspace OS.
#
# Cada matí baixa el paquet del teu intermedi i el porta a aquest repositori. Només toca el que és
# del sistema (la llista és a .wos/manifest.json). No toca mai el teu cervell, el context, la veu,
# work/, archives/ ni les teves skills, i no executa res del que baixa: el codi que corre és el
# d'aquest fitxer i el de .wos/actualitzador/actualitza.py, que són teus i només canvien si tu ho acceptes.
# Quan n'hi ha una versió nova, te la proposa en una branca a part i t'avisa; fins que l'acceptes, no corre.
#
# Necessita, a Settings → Secrets and variables → Actions:
#   · el secret WOS_CLAU: la clau de només lectura del teu intermedi;
#   · la variable WOS_INSTALLACIO: el nom de la teva instal·lació.

name: Actualitza

on:
  schedule:
    - cron: "0 5 * * *"   # cada dia a les 5:00 UTC (les 7:00 a l'estiu a Andorra, les 6:00 a l'hivern)
  workflow_dispatch:

permissions:
  contents: write
  issues: write          # per avisar-te quan hi ha un actualitzador nou
  pull-requests: write   # per proposar-te'l (no s'aplica fins que tu l'acceptes)

concurrency:
  group: actualitza
  cancel-in-progress: false

jobs:
  actualitza:
    # Només des de main: una branca amb un actualitzador proposat no corre mai, ni a mà, fins que l'acceptes.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: El teu repositori
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repo

      - name: El paquet del teu intermedi (només lectura)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: workspace-os-desplegados/${{ vars.WOS_INSTALLACIO }}
          ssh-key: ${{ secrets.WOS_CLAU }}
          path: paquet
          persist-credentials: false

      - name: Aplica el paquet
        run: python3 repo/.wos/actualitzador/actualitza.py paquet repo --origen "$(git -C paquet rev-parse HEAD)"

      - name: Desa-ho
        working-directory: repo
        run: |
          git config user.name "Workspace OS"
          git config user.email "workspace-os@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Res de nou."
            exit 0
          fi
          git commit -q -m "Actualització del Workspace OS"
          git push || { git pull --rebase -q && git push; }

      - name: Actualitzador nou? (només el proposa)
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .wos/actualitzador/actualitza.py --proposa ../paquet .
